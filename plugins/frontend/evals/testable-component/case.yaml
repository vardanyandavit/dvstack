schema_version: "1.0"
name: testable-component
description: A component no automated suite can drive cleanly. A good answer fixes the markup rather than teaching a better CSS selector.
tags: [testable-ui]
execution:
  max_turns: 20
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Our e2e tests keep breaking on this component and QA keeps asking for selectors. Can you make
    it easier to test?

    ```tsx
    export function InvoiceList({ invoices, onOpen, onDelete }) {
      return (
        <div className="css-1x2y3z">
          {invoices.map((inv, i) => (
            <div key={i} className="row" onClick={() => onOpen(inv)}>
              <span>{inv.number}</span>
              <span>{inv.status}</span>
              <div className="icon-btn" onClick={() => onDelete(inv)}>
                <TrashIcon />
              </div>
            </div>
          ))}
        </div>
      );
    }
    ```
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
    weight: 1
  - name: emits-semantic-button
    type: regex
    pattern: "<button"
    match: contains
    weight: 1
  - name: gives-accessible-name
    type: regex
    pattern: "aria-label"
    match: contains
    weight: 1
  - name: div-handlers-become-controls
    type: llm
    weight: 3
    criteria: |
      The rewritten component replaces the `div` + `onClick` handlers with real interactive elements
      (`<button>`, or a link/row control with a proper role) so they are keyboard reachable and
      focusable. FAIL if the answer keeps clickable `div`s and only adds a `data-testid` to them.
  - name: icon-button-named
    type: llm
    weight: 2
    criteria: |
      The icon-only delete control gets an accessible name that identifies WHICH invoice it deletes
      or is otherwise disambiguated per row (e.g. `aria-label={`Delete invoice ${inv.number}`}`),
      rather than a bare shared label like "Delete" repeated on every row. A per-row scoped
      explanation of how the test targets it also passes.
  - name: stable-row-identity
    type: llm
    weight: 2
    criteria: |
      The answer fixes row identity: `key={i}` (array index) is replaced with a stable domain id,
      and the row is made addressable by something meaningful — a domain-named `data-testid`
      (e.g. `data-testid="invoice-row"` plus the invoice number, not `div-3`) or a row role with an
      accessible name. FAIL if index keys survive unremarked.
  - name: fixes-markup-not-selectors
    type: llm
    weight: 2
    criteria: |
      The answer's primary remedy is changing the COMPONENT so it has queryable identity, and it
      does not recommend that the test reach for the generated class `.css-1x2y3z` or a structural
      CSS/XPath chain. Mentioning that the old selector was brittle is fine.
